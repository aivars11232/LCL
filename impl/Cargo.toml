# LCL implementation workspace.
#
# This workspace is a CONSUMER of the canonical LCL Core 0.1.0 specification.
# It never writes to, modifies, or is packaged with `canonical/`.
#
# Milestone M0 scope: spec authority loader, diagnostics skeleton, conformance
# skeleton.
#
# Milestone M1 scope: adds `lcl-lexer`, a deterministic non-executing lexer.
#
# Milestone M2 scope: adds `lcl-parser`, a deterministic non-executing parser
# over M1 tokens.
#
# Milestone M3 scope: adds `lcl-resolver`, a deterministic non-executing
# resolver over M2 syntax trees and explicit source units.
#
# Milestone M4 scope: adds `lcl-checker`, a deterministic non-executing static
# and type checker over the M3 resolved program graph.
#
# Milestone M5 scope: adds `lcl-semantics`, a deterministic no-effect semantic
# preflight over the M4 checked model plus explicit invocation data. It produces
# an accepted execution plan or an exact pre-effect failure.
#
# Milestone M6 scope: adds `lcl-runtime`, the deterministic evaluator and
# runtime over an accepted M5 plan. Every external effect leaves the language
# through its `Host` capability boundary; the runtime core itself performs no
# filesystem, process, network, provider or clock access. The complete
# executable Core operation surface and its real host adapters are M7's.
#
# Milestone M7 scope: adds `lcl-capabilities`, the host effect boundary --
# implementation profiles, address classes, capability grants, resource bounds
# and the real filesystem, process and network adapters -- and `lcl-stdlib`,
# the executable Core operation surface that maps the 39 registered rows to
# pure logic or to bounded, authorized capability requests.
#
# Milestone M8 scope: adds `lcl-completion`, canonical processing steps 11
# through 13 -- post-execution VERIFY and TEST, evidence resolution,
# SUCCESS/FAILURE selection and exactly one terminal invocation status with its
# declared outputs -- and turns `lcl-conformance` from a descriptive index into
# an executable case runner. Completion observes an execution and performs no
# effect of its own; a TEST root that executes a referenced graph does so
# through the runtime's existing operation and host boundary.
#
# Milestone M10 scope: adds `lcl-workspace`, the editor, project shell, live
# diagnostics, execution inspection and debugger a person actually uses. It is
# a consumer of `lcl-protocol` and holds no language rule of its own: it does
# not tokenize, parse, resolve, check or evaluate anything, and every span it
# paints and every diagnostic it shows was decided by an engine layer. It
# serves a browser frontend over a loopback HTTP server written on `std::net`.
#
# Milestone M11 scope: adds `lcl-hardening`, the release gate. It holds a
# deterministic seeded generator, mutation and adversarial corpora, the
# cross-layer invariants every stage must hold under hostile input,
# performance and repeatability measurements, the product-level security
# matrix, the staged application ladder and the packaging smoke test. It
# defines no language rule and nothing depends on it: it drives the same
# public surfaces a user drives.
#
# Dependency policy: std only. The spec authority loader is the trust root for
# every later layer, so it carries no third-party supply-chain surface.

[workspace]
resolver = "2"
members = [
    "crates/lcl-spec",
    "crates/lcl-localization",
    "crates/lcl-diagnostics",
    "crates/lcl-lexer",
    "crates/lcl-parser",
    "crates/lcl-resolver",
    "crates/lcl-checker",
    "crates/lcl-semantics",
    "crates/lcl-runtime",
    "crates/lcl-capabilities",
    "crates/lcl-stdlib",
    "crates/lcl-completion",
    "crates/lcl-project",
    "crates/lcl-cli",
    "crates/lcl-protocol",
    "crates/lcl-workspace",
    # Last: the conformance runner executes cases through every layer above, so
    # it depends on all of them.
    "crates/lcl-conformance",
    # Release hardening, which drives every layer above through its public
    # surfaces and adds none of its own.
    "crates/lcl-hardening",
]

[workspace.package]
# The product version, which is not the language version. This workspace
# implements LCL Core 0.1.0 and says so separately: `lcl version` prints the
# tool version, the engine protocol and the language version on three lines,
# and `lcl-conformance`'s report states the implementation version beside the
# language version it was judged against. 0.1.0 here is the first release of
# the implementation, frozen by LCL-TASK-0020 as the release candidate.
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
publish = false
