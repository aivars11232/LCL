[package]
name = "lcl-conformance"
description = "Conformance for LCL Core: the descriptive requirement index, plus an executable case runner that carries concrete sources through every implemented stage and reports observed against expected. Indexed requirements and executed cases are separate types and are never summed together."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
lcl-spec = { path = "../lcl-spec" }
lcl-diagnostics = { path = "../lcl-diagnostics" }
lcl-lexer = { path = "../lcl-lexer" }
lcl-parser = { path = "../lcl-parser" }
lcl-resolver = { path = "../lcl-resolver" }
lcl-checker = { path = "../lcl-checker" }
lcl-semantics = { path = "../lcl-semantics" }
lcl-runtime = { path = "../lcl-runtime" }
lcl-capabilities = { path = "../lcl-capabilities" }
lcl-stdlib = { path = "../lcl-stdlib" }
lcl-completion = { path = "../lcl-completion" }
