[package]
name = "lcl-resolver"
description = "Deterministic, non-executing resolver for LCL Core 0.1.0. Binds versions, imports, extensions, namespaces, IDs and REF across explicit source units and builds the structural candidate graph, or produces canonical resolution diagnostics."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
lcl-spec = { path = "../lcl-spec" }
lcl-diagnostics = { path = "../lcl-diagnostics" }
lcl-lexer = { path = "../lcl-lexer" }
lcl-parser = { path = "../lcl-parser" }
