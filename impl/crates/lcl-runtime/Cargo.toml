[package]
name = "lcl-runtime"
description = "Deterministic evaluator and runtime for LCL Core 0.1.0. An accepted execution plan plus an explicit host capability boundary in; canonical execution events, invocation results, state and diagnostics out. No effect occurs except through the Host boundary."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
lcl-spec = { path = "../lcl-spec" }
lcl-diagnostics = { path = "../lcl-diagnostics" }
lcl-lexer = { path = "../lcl-lexer" }
lcl-parser = { path = "../lcl-parser" }
lcl-resolver = { path = "../lcl-resolver" }
lcl-checker = { path = "../lcl-checker" }
lcl-semantics = { path = "../lcl-semantics" }
