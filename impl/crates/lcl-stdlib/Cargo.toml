[package]
name = "lcl-stdlib"
description = "The executable LCL Core 0.1.0 standard library: the closed 39-row operation surface and the 11 built-in functions, mapped to pure logic or to bounded, authorized capability requests. It decides language meaning; the host decides only what happened."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
lcl-spec = { path = "../lcl-spec" }
lcl-diagnostics = { path = "../lcl-diagnostics" }
lcl-lexer = { path = "../lcl-lexer" }
lcl-parser = { path = "../lcl-parser" }
lcl-resolver = { path = "../lcl-resolver" }
lcl-checker = { path = "../lcl-checker" }
lcl-semantics = { path = "../lcl-semantics" }
lcl-runtime = { path = "../lcl-runtime" }
lcl-capabilities = { path = "../lcl-capabilities" }
